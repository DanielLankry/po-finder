name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check documentation links
        run: npm run docs:links

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: placeholder
          RESEND_API_KEY: placeholder
          CRON_SECRET: placeholder
          ADMIN_SECRET: placeholder
          HYP_MASOF: "0010131918"
          HYP_PASSP: yaad
          HYP_API_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://pokarov.co.il
          NEXT_PUBLIC_META_PIXEL_ID: "27527545196939763"
