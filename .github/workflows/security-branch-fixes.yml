name: One-off reviewed branch privacy cleanup

on:
  push:
    branches: [master]
    paths:
      - .github/security-branch-fixes-request.json

permissions:
  contents: write

concurrency:
  group: po-finder-reviewed-branch-privacy-cleanup
  cancel-in-progress: false

jobs:
  apply-reviewed-fixes:
    if: github.repository == 'DanielLankry/po-finder' && github.actor == 'DanielLankry'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply only the leased, reviewed feature-branch changes atomically
        env:
          GIT_TERMINAL_PROMPT: '0'
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 scripts/apply-security-branch-fixes.py
